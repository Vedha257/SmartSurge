version: '3.8'

services:
  backend:
    build: ./backend
    container_name: smartsurge-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
      - ./backend/database:/app/database
    environment:
      - DATABASE_URL=database/smartsurge.db
      - UPLOAD_FOLDER=uploads/
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smartsurge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped